</style></head><body><div id="app"></div><input accept="application/json,.json" hidden="" id="importFile" type="file"/><script>const KEY='limegrid_v01';
const DEFAULT_TIMES=[['07:45','08:35'],['08:40','09:30'],['09:45','10:35'],['10:40','11:30'],['11:35','12:25'],['12:30','13:20'],['13:25','14:15'],['14:20','15:10']];
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
const uid=()=>{try{if(globalThis.crypto?.randomUUID)return crypto.randomUUID()}catch(e){}return `id-${Date.now()}-${Math.random().toString(36).slice(2)}`};
const blank=()=>({version:1,children:[],subjects:[],teachers:[],lessons:[],schools:[],events:[]});
let storageMode='persistent';
function testStorage(){try{const probe='limegrid_probe_'+uid();localStorage.setItem(probe,'ok');if(localStorage.getItem(probe)!=='ok')throw Error('readback');localStorage.removeItem(probe);return true}catch(e){storageMode='blocked';return false}}
testStorage();
let data=migrate(load()),current=data.children[0]?.id||null,view='week',page='plan',weekOffset=0,day= Math.min(new Date().getDay()-1,4);if(day<0)day=0;
const app=document.getElementById('app');
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v?.version===1&&['children','subjects','teachers','lessons'].every(k=>Array.isArray(v[k])))return v;}catch(e){console.warn('Daten konnten nicht gelesen werden:',e)}return blank()}
function migrate(v){
 // Existing 0.1/0.2 data stays intact. Schools are canonicalized by name.
 v.schools=Array.isArray(v.schools)?v.schools:[];v.events=Array.isArray(v.events)?v.events:[];
 for(const name of [...v.children.map(c=>c.school),...v.teachers.map(t=>t.school)].filter(Boolean)){
  if(!v.schools.some(s=>schoolKey(s.name)===schoolKey(name)))v.schools.push({id:uid(),name:name.trim()});
 }
 for(const c of v.children){const school=v.schools.find(s=>schoolKey(s.name)===schoolKey(c.school));if(school)c.school=school.name;}
 for(const t of v.teachers){const school=v.schools.find(s=>schoolKey(s.name)===schoolKey(t.school));if(school)t.school=school.name;}
 return v;
}
function canonicalSchool(name){return data.schools.find(s=>schoolKey(s.name)===schoolKey(name))?.name||name}
function save(){try{const serialized=JSON.stringify(data);localStorage.setItem(KEY,serialized);if(localStorage.getItem(KEY)!==serialized)throw new Error('Speicherprüfung fehlgeschlagen');storageMode='persistent';return true}catch(e){console.warn('Dauerhafte Speicherung fehlgeschlagen',e);storageMode='blocked';return false}}
function storageWarning(){return `<div class="storageWarning" role="alert"><strong>Speicherung blockiert.</strong> Dein Browser erlaubt in dieser Datei keine dauerhafte Datenspeicherung. Deine Eingaben bleiben vorerst nur während dieser Sitzung erhalten. Sichere sie unbedingt über <b>Einstellungen → JSON exportieren</b> und importiere die Datei beim nächsten Öffnen. Für dauerhaftes Speichern die Anwendung über eine HTTPS-Webadresse bereitstellen.</div>`}
function commit(next){data=next;const durable=save();render();toast(durable?'Gespeichert ✓':'NICHT DAUERHAFT GESPEICHERT – Sicherung exportieren');return true}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const teach=id=>data.teachers.find(t=>t.id===id);
function schoolKey(value){return String(value||'').trim().toLocaleLowerCase('de')}
const teacherMatches=(t,school,subjectId)=>schoolKey(t?.school)===schoolKey(school)&&Array.isArray(t.subjectIds)&&t.subjectIds.includes(subjectId);
const lessonAt=(d,s)=>data.lessons.find(l=>l.childId===current&&l.day===d&&l.slot===s);
const nav=[['plan','▦','Stundenplan'],['events','▤','Wochenplan'],['children','♧','Kinder'],['schools','⌂','Schulen'],['subjects','◈','Fächer'],['teachers','♙','Lehrkräfte'],['settings','⚙','Einstellungen']];
function toast(msg){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function button(text,click,cls=''){return `<button class="btn ${cls}" data-action="${click}">${text}</button>`}
function render(){try{localStorage.getItem(KEY)}catch(e){storageMode='blocked'}if((!current||!child())&&data.children.length)current=data.children[0].id;else if(!data.children.length)current=null;const n=data.children.length;
app.innerHTML=`<div class="app"><aside><div class="logo"><div class="brandIcon">✳</div><div>LIMEGRID<small>FAMILY SCHEDULE OS</small></div></div><nav class="nav">${nav.map(([id,icon,name])=>`<button class="${page===id?'active':''}" data-page="${id}"><span>${icon}</span>${name}</button>`).join('')}</nav><div class="sideBottom"><strong>● OFFLINEFÄHIG</strong><br>Speicherung abhängig vom Browser. Bitte regelmäßig sichern.<br>Version 0.29 · Schulzentrale</div></aside><main><header class="top"><div><div class="eyebrow">FAMILY COMMAND CENTER / 01</div><h1>${({plan:'Deine Schulwoche',events:'Dein Wochenplan',children:'Kinderprofile',schools:'Schulen',subjects:'Unterrichtsfächer',teachers:'Lehrkräfte',settings:'Einstellungen'})[page]}</h1><p class="sub">${({plan:'Alles Wichtige im Blick. Für jedes Kind, jeden Tag.',events:'Termine und Aufgaben für deine Kinder.',children:'Alle Kinder und ihre individuellen Unterrichtszeiten.',schools:'Schulen zentral verwalten und einheitlich zuordnen.',subjects:'Einmal anlegen, überall verwenden.',teachers:'Lehrkräfte zentral organisieren.',settings:'Daten sichern und individuell konfigurieren.'})[page]}</p></div><div class="actions">${page==='plan'?button('＋ Stunde','lesson-new','primary'):page==='events'?button('＋ Termin','event-new','primary'):page==='children'?button('＋ Kind','child-new','primary'):page==='schools'?button('＋ Schule','school-new','primary'):page==='subjects'?button('＋ Fach','subject-new','primary'):page==='teachers'?button('＋ Lehrkraft','teacher-new','primary'):''}</div></header>${storageMode==='blocked'?storageWarning():''}<div class="content">${page==='plan'?renderPlan():page==='events'?renderEvents():page==='children'?renderChildren():page==='schools'?renderSchools():page==='subjects'?renderSubjects():page==='teachers'?renderTeachers():renderSettings()}</div></main><nav class="mobileBar">${nav.map(([id,icon,name])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${icon}</span>${name}</button>`).join('')}</nav></div>`;
app.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{page=el.dataset.page;render()}));
app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action,el.dataset.id,el.dataset.day,el.dataset.slot)));
}
function profileBar(){return `<div class="sectionLabel"><h2>Deine Kinder <span style="color:var(--muted)">/ ${data.children.length}</span></h2>${button('＋ Kind hinzufügen','child-new','small')}</div><div class="profiles">${data.children.map(c=>`<button class="profile ${current===c.id?'active':''}" data-action="choose-child" data-id="${esc(c.id)}"><div class="avatar" style="background:${esc(c.color)}">${esc(c.name[0]?.toUpperCase())}</div><div><strong>${esc(c.name)}</strong><small>${esc(c.className||c.school||'Schulkind')}</small></div></button>`).join('')}</div>`}
function renderPlan(){if(!data.children.length)return `<div class="empty"><div class="eyebrow">DEIN STARTPUNKT</div><h2>Ein Plan. Alle Schulkinder.</h2><p>Trage einfach einen Namen ein. Fächer und Lehrkräfte kannst du später direkt bei den Stunden ergänzen.</p>${button('＋ Erstes Kind anlegen','child-new','primary')}</div>`;
const c=child();return `${profileBar()}<div class="toolbar"><div class="seg"><button class="${view==='week'?'sel':''}" data-action="view-week">▦ Woche</button><button class="${view==='day'?'sel':''}" data-action="view-day">☷ Tag</button></div><div class="infoPill">${esc(c.school||'Schule nicht angegeben')} · ${esc(c.className||'Klasse offen')} &nbsp; ${button('⚙ Zeiten','times','small')}</div></div>${view==='week'?renderWeek(c):renderDay(c)}<div class="legend">Tippe auf eine freie Zelle, um eine Stunde anzulegen, oder auf eine bestehende Stunde, um Details zu bearbeiten. Die Wochenansicht lässt sich auf kleinen Bildschirmen horizontal verschieben.</div>`}
function lessonHTML(l){let s=subj(l.subjectId),t=teach(l.teacherId);return `<button class="lesson" style="--subject:${esc(s?.color||'#c6ff35')}" data-action="lesson-edit" data-id="${esc(l.id)}"><strong>${esc(s?.abbr||'Fach')}</strong><small>${esc(t?.name||'Keine Lehrkraft')}</small><span class="room">${esc(l.room||'')}</span></button>`}
function renderWeek(c){
 let h='<div class="scheduleShell"><div class="weekGrid"><div class="gridCorner">ZEIT</div>'+DAYS.map((name,i)=>{const count=data.lessons.filter(l=>l.childId===current&&l.day===i).length;return `<button class="dayHead weekDayButton ${i===day?'isToday':''}" data-week-column="${i}" data-action="week-open-day" data-day="${i}" title="${esc(name)} in der Tagesansicht öffnen"><strong>${esc(name)}</strong><span>${esc(prettyDate(dateForWeekDay(i)))}</span><span>${count} ${count===1?'Stunde':'Stunden'} · Details ↗</span></button>`}).join('');
 for(let slot=0;slot<c.times.length;slot++){
  const tm=c.times[slot];h+=`<div class="timeCell"><strong>${slot+1}.</strong><span>${esc(tm[0])}</span><small>${esc(tm[1])}</small></div>`;
  for(let d=0;d<5;d++){const lesson=lessonAt(d,slot);h+=lesson?lessonHTML(lesson):`<button class="slot" data-action="lesson-new" data-day="${d}" data-slot="${slot}" aria-label="${esc(DAYS[d])}, ${slot+1}. Stunde hinzufügen">＋</button>`;}
 }
 const weekEvents=DAYS.map((name,index)=>({name,index,date:dateForWeekDay(index),items:currentDayEvents(index)}));
 const agenda='<section class="weekAgenda"><div class="weekAgendaTitle"><h3>Termine dieser Woche</h3><span>'+weekEvents.reduce((n,d)=>n+d.items.length,0)+' Einträge</span></div><div class="weekAgendaGrid">'+weekEvents.map(d=>'<div class="weekAgendaDay"><button class="weekAgendaDayTitle" data-action="week-open-day" data-day="'+d.index+'"><strong>'+esc(d.name)+'</strong><span>'+esc(prettyDate(d.date))+'</span></button>'+(d.items.length?d.items.map(e=>'<button class="weekAgendaEvent" data-action="event-edit" data-id="'+esc(e.id)+'"><strong>'+esc(e.title)+'</strong><span>'+esc(e.type||'Termin')+(e.repeat==='weekly'?' · ↻ wöchentlich':'')+(e.time?' · '+esc(e.time):'')+'</span></button>').join(''):'<p class="weekAgendaNone">Keine Termine</p>')+'</div>').join('')+'</div></section>';
 return '<div class="weekNav weekNavTop"><button class="btn small" data-action="week-prev">‹ Vorwoche</button><button class="btn small" data-action="week-now">Diese Woche</button><button class="btn small" data-action="week-next">Nächste ›</button></div><div class="classicGridHint"><span>WOCHENRASTER · MO–FR</span><span>← Seitlich wischen →</span></div><div class="weekJumpBar" role="group" aria-label="Wochentag im Raster anzeigen">'+DAYS.map((name,i)=>'<button type="button" class="weekJump" data-action="week-jump" data-day="'+i+'" aria-label="Zu '+esc(name)+' scrollen">'+esc(name.slice(0,2))+'</button>').join('')+'</div>'+h+'</div></div>'+agenda;
}

function localISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),n=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+n}
function dateForWeekDay(index){const date=new Date();date.setHours(12,0,0,0);const weekday=(date.getDay()+6)%7;date.setDate(date.getDate()-weekday+weekOffset*7+index);return localISO(date)}
function prettyDate(iso){const [y,m,d]=iso.split('-');return d+'.'+m+'.'+y}
function eventOccursOn(e,date){
 if(e.date===date)return true;
 if(e.repeat!=='weekly'||!validEventDate(e.date)||date<e.date)return false;
 const start=Date.parse(e.date+'T12:00:00Z'),target=Date.parse(date+'T12:00:00Z');
 return (target-start)%(7*86400000)===0;
}
function currentDayEvents(index){const date=dateForWeekDay(index);return (data.events||[]).filter(e=>e.childId===current&&eventOccursOn(e,date)).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function renderDay(c){
 const lessons=data.lessons.filter(l=>l.childId===current&&l.day===day).sort((a,b)=>a.slot-b.slot);
 const valid=lessons.filter(l=>l.slot>=0&&l.slot<c.times.length);
 const subjects=[...new Set(valid.map(l=>subj(l.subjectId)?.abbr||'Fach'))];
 const first=valid.length?c.times[valid[0].slot]?.[0]:null;
 const last=valid.length?c.times[valid[valid.length-1].slot]?.[1]:null;
 const title=esc(DAYS[day]),date=dateForWeekDay(day),events=currentDayEvents(day);
 const navDay=`<div class="dayHeading"><button class="dayArrow" data-action="day-prev" aria-label="Vorheriger Schultag">‹</button><div><span class="dayOverline">STUNDENPLAN / TAG 0${day+1}</span><h2>${title}</h2><div class="dayMeta">${esc(prettyDate(date))} · ${valid.length} Unterrichtsstunden${first&&last?' · '+esc(first)+'–'+esc(last):''}</div></div><button class="dayArrow" data-action="day-next" aria-label="Nächster Schultag">›</button></div>`;
 const summary=valid.length?`<div class="daySubjectStrip" aria-label="Fächer heute">${subjects.map(abbr=>`<span class="daySubjectChip">${esc(abbr)}</span>`).join('')}</div>`:'<p class="dayEmptyNote">Noch kein Unterricht eingetragen. Tippe auf eine freie Stunde, um zu beginnen.</p>';
 const eventBlock=`<section class="dailyEvents"><div class="dailyEventHead"><strong>Termine & Aufgaben <span>${events.length}</span></strong><button class="btn small" data-action="event-new-date">＋ Termin</button></div>${events.length?events.map(e=>`<button class="dailyEventCard" data-action="event-edit" data-id="${esc(e.id)}"><span class="dailyEventTime">${esc(e.time||'Ganztägig')}</span><span><strong>${esc(e.title)}</strong><small>${esc(e.type||'Termin')}${e.repeat==='weekly'?' · ↻ wöchentlich':''}${e.notes?' · '+esc(e.notes):''}</small></span><span class="dailyEventArrow">›</span></button>`).join(''):'<p class="dailyEventEmpty">Keine zusätzlichen Termine an diesem Tag.</p>'}</section>`;
 return `<div class="dayTools"><span class="dayHint">Tippe auf eine Stunde für alle Details</span>${button('⧉ Tag kopieren','day-copy','small')}</div><div class="weekNav"><button class="btn small" data-action="week-prev">‹ Vorwoche</button><button class="btn small" data-action="week-now">Diese Woche</button><button class="btn small" data-action="week-next">Nächste ›</button></div>${navDay}<div class="weekdayButtons">${DAYS.map((name,i)=>`<button class="btn small ${day===i?'primary':''}" data-action="choose-day" data-day="${i}" aria-label="${esc(name)} anzeigen">${name.slice(0,2)}</button>`).join('')}</div>${summary}<div class="dayList">${c.times.map((tm,s)=>{let l=lessonAt(day,s);return `<div class="dayItem"><div class="hour"><strong>${s+1}. Stunde</strong><br>${esc(tm[0])}–${esc(tm[1])}</div>${l?lessonHTML(l):`<button class="slot" data-action="lesson-new" data-day="${day}" data-slot="${s}">＋ Stunde hinzufügen</button>`}</div>`}).join('')}</div>${eventBlock}`;
}
function renderChildren(){return `${data.children.length?`<div class="cards">${data.children.map(c=>`<div class="entityCard"><div class="childCardDetails"><span class="childCardAvatar" style="background:${esc(c.color)}">${esc(c.name[0]?.toUpperCase()||'K')}</span><div class="childCardText"><strong>${esc(c.name)}</strong><small>${esc(c.school||'Keine Schule')} · ${esc(c.className||'Keine Klasse')}<br>${c.times.length} Unterrichtszeiten</small></div></div>${button('Bearbeiten','child-edit','small').replace('data-action=',`data-id="${esc(c.id)}" data-action=`)}</div>`).join('')}</div>`:'<p class="emptySmall">Noch keine Kinder angelegt.</p>'}`}
function renderSchools(){return `${data.schools.length?`<div class="cards">${data.schools.map(s=>`<div class="entityCard"><div><span class="schoolMark">⌂</span><strong>${esc(s.name)}</strong><small>${data.children.filter(c=>schoolKey(c.school)===schoolKey(s.name)).length} Kinder · ${data.teachers.filter(t=>schoolKey(t.school)===schoolKey(s.name)).length} Lehrkräfte</small></div>${button('Bearbeiten','school-edit','small').replace('data-action=',`data-id="${esc(s.id)}" data-action=`)}</div>`).join('')}</div>`:'<p class="emptySmall">Noch keine Schulen erfasst.</p>'}`}
function schoolSelect(label,value,optional=true){return selectField(label,'school',[...(optional?[['','Keine Schule']]:[]),...data.schools.map(s=>[s.name,s.name])],value)}
function editSchool(id){
 const old=data.schools.find(s=>s.id===id),fresh=!old;
 dialog(fresh?'Schule anlegen':'Schule bearbeiten','Schulnamen werden zentral gespeichert und bei Kindern und Lehrkräften verwendet.',field('Schulname *','name','text',old?.name||'','required maxlength="100"'),v=>{

   d.schools=d.schools.map(s=>s.id===id?{...s,name}:s);

 },fresh?null:()=>{

const EVENT_TYPES=['Schularbeit','Hausaufgabe','Ausflug','Termin','Sonstiges'];
const validEventDate=value=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const [y,m,d]=value.split('-').map(Number);if(y<1000||y>9999||m<1||m>12||d<1||d>31)return false;const probe=new Date(Date.UTC(y,m-1,d));return probe.getUTCFullYear()===y&&probe.getUTCMonth()===m-1&&probe.getUTCDate()===d};
function renderEvents(){

 let n=c.times.length;
 const draw=n=>Array.from({length:n},(_,i)=>{let t=c.times[i]||['08:00','08:50'];return field(`${i+1}. Stunde · Beginn`,`start${i}`,'time',t[0],'required')+field(`${i+1}. Stunde · Ende`,`end${i}`,'time',t[1],'required')}).join('');
 dialog('Unterrichtszeiten','Stundenanzahl und Beginn/Ende individuell einstellen (1–16 Stunden).',
  `<div class="field full"><label for="periodCount">Anzahl der Stunden</label><input id="periodCount" type="number" min="1" max="16" value="${n}"></div><div id="periodFields" class="formGrid" style="grid-column:1/-1">${draw(n)}</div>`,v=>{
   let count=Number(document.getElementById('periodCount').value);
   if(!Number.isInteger(count)||count<1||count>16){alert('Bitte eine Stundenanzahl zwischen 1 und 16 wählen.');return false}
   let times=Array.from({length:count},(_,i)=>[v['start'+i],v['end'+i]]);
   if(times.some(t=>!t[0]||!t[1]||t[0]>=t[1])||times.some((t,i)=>i>0&&t[0]<times[i-1][1])){alert('Bitte gültige, überschneidungsfreie Stundenzeiten eintragen.');return false}
   if(data.lessons.some(l=>l.childId===c.id&&l.slot>=count)){alert('In den entfernten Stunden liegen noch Unterrichtseinträge. Bitte zuerst diese Stunden verschieben oder löschen.');return false}
   let d=copy();d.children=d.children.map(x=>x.id===c.id?{...x,times}:x);return commit(d)
 });
 const count=document.getElementById('periodCount');count.addEventListener('change',()=>{
  const amount=Math.max(1,Math.min(16,Number(count.value)||1));
  const currentValues=Object.fromEntries(new FormData(document.getElementById('editor')));
  c={...c,times:Array.from({length:amount},(_,i)=>[currentValues['start'+i]||c.times[i]?.[0]||'08:00',currentValues['end'+i]||c.times[i]?.[1]||'08:50'])};
  document.getElementById('periodFields').innerHTML=draw(amount)
 });
}
function copyDay(){
 const c=child();if(!c)return;
 const source=day;
 const entries=data.lessons.filter(l=>l.childId===c.id&&l.day===source);
 if(!entries.length){toast('Dieser Tag enthält noch keine Stunden');return}
 const targets=DAYS.map((name,index)=>index===source?null:[index,name]).filter(Boolean);
 dialog('Schultag kopieren','Nur leere Stundenplätze werden befüllt. Bereits eingetragene Stunden bleiben unverändert.',
 selectField('Zieltag','targetDay',targets,targets[0][0])+`<div class="field full"><small>${entries.length} Unterrichtsstunde(n) von ${DAYS[source]} übernehmen. Bestehende Einträge werden übersprungen.</small></div>`,v=>{
  const dest=Number(v.targetDay);if(dest===source||!Number.isInteger(dest)||dest<0||dest>=DAYS.length)return false;
  const d=copy();let count=0;
  for(const l of entries){if(d.lessons.some(x=>x.childId===c.id&&x.day===dest&&x.slot===l.slot))continue;
   d.lessons.push({...l,id:uid(),day:dest});count++;
  }
  if(!count){toast('Alle Stundenplätze am Zieltag sind bereits belegt');return false}
  day=dest;commit(d);toast(`${count} Stunde(n) übernommen · vorhandene Einträge erhalten`);return true
 });
}
function checkPersistence(){try{const probe='limegrid_health_'+uid();localStorage.setItem(probe,'prüfwert');const value=localStorage.getItem(probe);localStorage.removeItem(probe);if(value!=='prüfwert')throw Error('Speicherlesefehler');const live=localStorage.getItem(KEY);if(live===null&&data.children.length)throw Error('Vorhandene Daten nicht gespeichert');if(live!==null&&JSON.stringify(JSON.parse(live))!==JSON.stringify(data))throw Error('Speicherinhalt stimmt nicht mit der Anzeige überein');toast('Speicher-Leseprüfung erfolgreich ✓');storageMode='persistent';render()}catch(e){storageMode='blocked';render();alert('Dauerhafte Speicherung nicht verfügbar: '+e.message+'\nBitte JSON exportieren.')}}
function download(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download='LIMEGRID-Sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON-Sicherung zum Download angeboten')}
function importFile(){let input=document.getElementById('importFile');input.value='';input.click()}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('Die Sicherung ist zu groß.');const v=JSON.parse(await f.text());if(v.version!==1||!['children','subjects','teachers','lessons'].every(k=>Array.isArray(v[k])))throw Error('Unbekanntes Datenformat.');if(v.events!==undefined&&(!Array.isArray(v.events)||!v.events.every(e=>typeof e.id==='string'&&typeof e.childId==='string'&&typeof e.title==='string'&&typeof e.date==='string'&&validEventDate(e.date)&&(!e.repeat||['none','weekly'].includes(e.repeat)))))throw Error('Ungültige Wochenplan-Einträge.');if(!v.children.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.times)&&c.times.every(t=>Array.isArray(t)&&t.length===2&&t.every(x=>/^\d\d:\d\d$/.test(x))))||!v.subjects.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&typeof s.abbr==='string')||!v.teachers.every(t=>typeof t.id==='string'&&typeof t.name==='string')||!v.lessons.every(l=>typeof l.id==='string'&&typeof l.childId==='string'&&Number.isInteger(l.day)&&l.day>=0&&l.day<=4&&Number.isInteger(l.slot)&&l.slot>=0))throw Error('Ungültige oder unvollständige Sicherungsdaten.');if(!confirm('Die vorhandenen Daten werden durch diese Sicherung ersetzt. Fortfahren? Bitte vorher exportieren.'))return;if(commit(migrate(v))){current=v.children[0]?.id||null;page='plan';render()}}catch(err){alert('Import fehlgeschlagen: '+err.message)}});
function action(a,id,d,s){if(a==='week-jump'){const i=Math.max(0,Math.min(4,Number(d)||0)),shell=document.querySelector('.scheduleShell'),head=shell?.querySelector('[data-week-column="'+i+'"]');if(shell&&head){const left=head.offsetLeft-(shell.querySelector('.gridCorner')?.offsetWidth||0)-9;shell.scrollTo({left:Math.max(0,left),behavior:'smooth'});document.querySelectorAll('.weekJump').forEach((b,j)=>b.classList.toggle('active',j===i));}return}if(a==='choose-child'){current=id;page='plan';render()}else if(a==='event-child'){current=id;page='events';render()}else if(a==='event-new'){editEvent()}else if(a==='event-new-date'){editEvent(null,dateForWeekDay(day))}else if(a==='week-prev'){weekOffset--;render()}else if(a==='week-next'){weekOffset++;render()}else if(a==='week-now'){weekOffset=0;render()}else if(a==='event-edit'){editEvent(id)}else if(a==='choose-day'){day=Math.max(0,Math.min(4,Number(d)||0));render()}else if(a==='week-open-day'){day=Math.max(0,Math.min(4,Number(d)||0));view='day';render()}else if(a==='day-prev'){day=(day+4)%5;render()}else if(a==='day-next'){day=(day+1)%5;render()}else if(a==='view-week'){view='week';render()}else if(a==='view-day'){view='day';render()}else if(a==='school-new')editSchool();else if(a==='school-edit')editSchool(id);else if(a==='child-new')editChild();else if(a==='child-edit')editChild(id);else if(a==='subject-new')editSubject();else if(a==='subject-edit')editSubject(id);else if(a==='teacher-new')editTeacher();else if(a==='teacher-edit')editTeacher(id);else if(a==='lesson-new')editLesson(null,d,s);else if(a==='lesson-edit')showLessonDetail(id);else if(a==='times')editTimes();else if(a==='day-copy')copyDay();else if(a==='storage-test')checkPersistence();else if(a==='export')download();else if(a==='import')importFile()}
window.addEventListener('beforeunload',e=>{if(storageMode==='blocked'&&(data.children.length||data.lessons.length||data.subjects.length)){e.preventDefault();e.returnValue=''}});
render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')) {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline-Installation nicht verfügbar:',err)))}
</script></body></html>
