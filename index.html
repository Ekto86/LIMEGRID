</style></head><body><div id="app"></div><input accept="application/json,.json" hidden="" id="importFile" type="file"/><script>const KEY='limegrid_v01';

function migrate(v){
 // Existing 0.1/0.2 data stays intact. Schools are canonicalized by name.
 v.schools=Array.isArray(v.schools)?v.schools:[];
 for(const name of [...v.children.map(c=>c.school),...v.teachers.map(t=>t.school)].filter(Boolean)){

 }

}

const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){try{localStorage.getItem(KEY)}catch(e){storageMode='blocked'}if((!current||!child())&&data.children.length)current=data.children[0].id;else if(!data.children.length)current=null;const n=data.children.length;
app.innerHTML=`<div class="app"><aside><div class="logo"><div class="brandIcon">✳</div><div>LIMEGRID<small>FAMILY SCHEDULE OS</small></div></div><nav class="nav">${nav.map(([id,icon,name])=>`<button class="${page===id?'active':''}" data-page="${id}"><span>${icon}</span>${name}</button>`).join('')}</nav><div class="sideBottom"><strong>● OFFLINEFÄHIG</strong><br>Speicherung abhängig vom Browser. Bitte regelmäßig sichern.<br>Version 0.15 · Schulzentrale</div></aside><main><header class="top"><div><div class="eyebrow">FAMILY COMMAND CENTER / 01</div><h1>${({plan:'Deine Schulwoche',children:'Kinderprofile',schools:'Schulen',subjects:'Unterrichtsfächer',teachers:'Lehrkräfte',settings:'Einstellungen'})[page]}</h1><p class="sub">${({plan:'Alles Wichtige im Blick. Für jedes Kind, jeden Tag.',children:'Alle Kinder und ihre individuellen Unterrichtszeiten.',schools:'Schulen zentral verwalten und einheitlich zuordnen.',subjects:'Einmal anlegen, überall verwenden.',teachers:'Lehrkräfte zentral organisieren.',settings:'Daten sichern und individuell konfigurieren.'})[page]}</p></div><div class="actions">${page==='plan'?button('＋ Stunde','lesson-new','primary'):page==='children'?button('＋ Kind','child-new','primary'):page==='schools'?button('＋ Schule','school-new','primary'):page==='subjects'?button('＋ Fach','subject-new','primary'):page==='teachers'?button('＋ Lehrkraft','teacher-new','primary'):''}</div></header>${storageMode==='blocked'?storageWarning():''}<div class="content">${page==='plan'?renderPlan():page==='children'?renderChildren():page==='schools'?renderSchools():page==='subjects'?renderSubjects():page==='teachers'?renderTeachers():renderSettings()}</div></main><nav class="mobileBar">${nav.map(([id,icon,name])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${icon}</span>${name}</button>`).join('')}</nav></div>`;

function renderChildren(){return `${data.children.length?`<div class="cards">${data.children.map(c=>`<div class="entityCard"><div><span class="tinySwatch" style="background:${esc(c.color)}"></span><strong>${esc(c.name)}</strong><small>${esc(c.school||'Keine Schule')} · ${esc(c.className||'Keine Klasse')}<br>${c.times.length} Unterrichtszeiten</small></div>${button('Bearbeiten','child-edit','small').replace('data-action=',`data-id="${esc(c.id)}" data-action=`)}</div>`).join('')}</div>`:'<p class="emptySmall">Noch keine Kinder angelegt.</p>'}`}

 });

function renderSubjects(){return `${data.subjects.length?`<div class="cards">${data.subjects.map(s=>`<div class="entityCard"><div><span class="tinySwatch" style="background:${esc(s.color)}"></span><strong>${esc(s.abbr)}</strong><small>${esc(s.name)}</small></div>${button('Bearbeiten','subject-edit','small').replace('data-action=',`data-id="${esc(s.id)}" data-action=`)}</div>`).join('')}</div>`:'<p class="emptySmall">Noch keine Fächer angelegt.</p>'}`}

function dialog(title,help,html,onSave,onDelete){document.querySelector('.modalCover')?.remove();let cover=document.createElement('div');cover.className='modalCover';cover.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="eyebrow">LIMEGRID / SCHNELLEINGABE</div><h2>${esc(title)}</h2><p class="help">${esc(help)}</p><form id="editor"><div class="formGrid">${html}</div><div class="modalFooter">${onDelete?'<button class="btn danger" type="button" id="del">Löschen</button>':''}<button class="btn" type="button" id="cancel">Abbrechen</button><button class="btn primary" type="submit">✓ Speichern</button></div></form></div>`;document.body.append(cover);const close=()=>cover.remove();cover.addEventListener('click',e=>{if(e.target===cover)close()});cover.querySelector('#cancel').onclick=close;cover.addEventListener('keydown',e=>{if(e.key==='Escape')close()});cover.querySelector('#editor').onsubmit=e=>{e.preventDefault();let form=new FormData(e.currentTarget),values=Object.fromEntries(form);values.subjectIds=form.getAll('subjectIds');try{if(onSave(values)!==false)close()}catch(err){console.error('Speichern fehlgeschlagen',err);let msg=cover.querySelector('.formError');if(!msg){msg=document.createElement('p');msg.className='formError';msg.setAttribute('role','alert');msg.style='color:#ffb0ab;background:#451d20;padding:12px;border-radius:10px';cover.querySelector('.modalFooter').before(msg)}msg.textContent='Speichern fehlgeschlagen: '+(err?.message||'Unbekannter Fehler')}};if(onDelete)cover.querySelector('#del').onclick=()=>{if(confirm('Diesen Eintrag wirklich löschen? Zugeordnete Stunden können dadurch entfernt werden.')){if(onDelete()!==false)close()}};cover.querySelector('input,select,textarea')?.focus()}

 dialog(fresh?'Lehrkraft hinzufügen':'Lehrkraft bearbeiten','Verbinde jede Lehrkraft mit einer Schule und einem oder mehreren Unterrichtsfächern.',field('Name *','name','text',t.name,'required maxlength="100"')+schoolInput+subjects+`<div class="field full"><label for="f_notes">Notizen / Kontakt (optional)</label><textarea name="notes" id="f_notes" rows="3" maxlength="400">${esc(t.notes||'')}</textarea></div>`,v=>{
 let d=copy(),ids=v.subjectIds.filter(id=>d.subjects.some(x=>x.id===id)),school=v.school.trim();
 if(!v.name.trim()||!school||!d.schools.some(x=>x.name===school)){alert('Bitte Name und eine vorhandene Schule angeben.');return false}
 if(!ids.length){alert('Bitte mindestens ein Unterrichtsfach auswählen.');return false}
 let rec={...t,id:id||uid(),name:v.name.trim(),notes:v.notes.trim(),school,subjectIds:ids};
 fresh?d.teachers.push(rec):d.teachers=d.teachers.map(x=>x.id===id?rec:x);
 // Bestehende Stunden bleiben bei Änderungen an der Lehrkraft erhalten.
 return commit(d)
 },fresh?null:()=>{let d=copy();d.teachers=d.teachers.filter(x=>x.id!==id);d.lessons=d.lessons.map(x=>x.teacherId===id?{...x,teacherId:''}:x);return commit(d)})
}

function showLessonDetail(id){
 const l=data.lessons.find(x=>x.id===id);
 if(!l){toast('Diese Unterrichtsstunde ist nicht mehr vorhanden.');return}
 const c=data.children.find(x=>x.id===l.childId),subject=subj(l.subjectId),teacher=teach(l.teacherId);
 const tm=c?.times?.[l.slot];
 const row=(label,value,wide=false)=>'<div class="lessonDetailRow'+(wide?' wide':'')+'"><small>'+esc(label)+'</small><strong>'+esc(value||'Keine Angabe')+'</strong></div>';
 document.querySelector('.lessonDetailCover')?.remove();
 let cover=document.createElement('div');
 cover.className='lessonDetailCover';
 cover.innerHTML='<section class="lessonDetailPanel" role="dialog" aria-modal="true" aria-label="Unterrichtsdetails"><div class="lessonDetailHeader"><div><div class="lessonDetailSubject" style="color:'+esc(subject?.color||'#c6ff35')+'">'+esc(subject?.abbr||'FACH')+'</div><h2>'+esc(subject?.name||'Unterrichtsfach')+'</h2></div><button class="lessonDetailClose" type="button" aria-label="Schließen">×</button></div><div class="lessonDetailMeta">'+esc(c?.name||'Kind')+' · '+esc(DAYS[l.day]||'Unbekannter Tag')+' · '+esc((l.slot+1)+'. Stunde')+'</div><div class="lessonDetailGrid">'+row('Uhrzeit',tm?tm[0]+'–'+tm[1]:'Nicht konfiguriert')+row('Lehrkraft',teacher?.name)+row('Schule',c?.school)+row('Klasse',c?.className)+row('Raum',l.room)+row('Notizen',l.notes,true)+'</div><div class="lessonDetailActions"><button type="button" class="btn lessonDetailDismiss">Schließen</button><button type="button" class="btn primary lessonDetailEdit">✎ Bearbeiten</button></div></section>';
 document.body.append(cover);
 const close=()=>{document.removeEventListener('keydown',escape);cover.remove()};
 const escape=e=>{if(e.key==='Escape')close()};
 cover.addEventListener('click',e=>{if(e.target===cover)close()});
 cover.querySelector('.lessonDetailClose').onclick=close;
 cover.querySelector('.lessonDetailDismiss').onclick=close;
 cover.querySelector('.lessonDetailEdit').onclick=()=>{close();current=l.childId;editLesson(l.id)};
 document.addEventListener('keydown',escape);
 cover.querySelector('.lessonDetailClose').focus();
}
function editLesson(id,desiredDay,desiredSlot){
 if(!child()){toast('Bitte zuerst ein Kind anlegen');editChild();return}
 let l=data.lessons.find(x=>x.id===id),fresh=!l;
 l||={childId:current,day:Number(desiredDay??0),slot:Number(desiredSlot??0),subjectId:'',teacherId:'',room:'',notes:''};
 const c=child(),lessonDays=DAYS.map((d,i)=>[i,d]);
 const available=subjectId=>data.teachers.filter(t=>teacherMatches(t,c.school,subjectId));
 const teacherItems=subjectId=>[['','Keine Angabe'],...available(subjectId).map(t=>[t.id,t.name]),...(l.teacherId&&!available(subjectId).some(t=>t.id===l.teacherId)?[[l.teacherId,`${teach(l.teacherId)?.name||'Gelöschte Lehrkraft'} (bisherige Zuordnung)`]]:[])];
 const teacherSelect=selectField('Lehrkraft (optional)','teacherId',teacherItems(l.subjectId),l.teacherId);
 dialog(fresh?'Unterrichtsstunde hinzufügen':'Unterrichtsstunde bearbeiten','Lehrkräfte werden passend zur Schule des Kindes und zum ausgewählten Fach gefiltert.',selectField('Wochentag','day',lessonDays,l.day)+selectField('Unterrichtsstunde','slot',c.times.map((t,i)=>[i,`${i+1}. Stunde · ${t[0]}–${t[1]}`]),l.slot)+selectField('Fach','subjectId',[['','＋ Neues Fach eingeben'],...data.subjects.map(s=>[s.id,`${s.abbr} · ${s.name}`])],l.subjectId)+`<div id="newSubjectWrap" class="field full">${field('Neues Fach anlegen','newSubject','text','','placeholder="z. B. Mathematik" maxlength="90"')}</div>`+teacherSelect+field('Neue Lehrkraft (optional)','newTeacher','text','','placeholder="z. B. Frau Huber" maxlength="100"')+`<details class="optionalDetails" ${l.room||l.notes?'open':''}><summary>Raum und Notizen (optional)</summary><div class="optionalGrid">${field('Raum','room','text',l.room,'maxlength="50"')}<div class="field full"><label for="f_notes">Notizen</label><textarea id="f_notes" name="notes" rows="3" maxlength="400">${esc(l.notes)}</textarea></div></div></details>`,v=>{
 let d=copy(),subjectId=v.subjectId,teacherId=v.teacherId;
 const newSubject=(v.newSubject||'').trim(),newTeacher=(v.newTeacher||'').trim();
 if(newSubject){let existing=d.subjects.find(s=>schoolKey(s.name)===schoolKey(newSubject)||schoolKey(s.abbr)===schoolKey(newSubject));if(existing)subjectId=existing.id;else{subjectId=uid();d.subjects.push({id:subjectId,name:newSubject,abbr:newSubject.length<=8?newSubject:newSubject.slice(0,3).toUpperCase(),color:['#6bd6ff','#c6ff35','#b594ff','#ffca66','#fb83b8'][d.subjects.length%5]})}}
 if(!subjectId||!d.subjects.some(s=>s.id===subjectId)){alert('Bitte ein Fach wählen oder einen neuen Fachnamen eingeben.');return false}
 if(newTeacher){let existing=d.teachers.find(t=>schoolKey(t.name)===schoolKey(newTeacher)&&schoolKey(t.school)===schoolKey(c.school));if(existing){teacherId=existing.id;if(!existing.subjectIds.includes(subjectId))existing.subjectIds.push(subjectId)}else{teacherId=uid();d.teachers.push({id:teacherId,name:newTeacher,school:c.school||'',subjectIds:[subjectId],notes:''})}}
 let rec={...l,id:id||uid(),childId:current,day:Number(v.day),slot:Number(v.slot),subjectId,teacherId,room:v.room.trim(),notes:v.notes.trim()};
 if(rec.teacherId&&!newTeacher&&rec.teacherId!==l.teacherId&&!teacherMatches(teach(rec.teacherId),c.school,rec.subjectId)){alert('Diese Lehrkraft ist der Schule und dem Fach nicht zugeordnet.');return false}
 if(rec.teacherId&&!newTeacher&&rec.teacherId===l.teacherId&&rec.subjectId!==l.subjectId&&!teacherMatches(teach(rec.teacherId),c.school,rec.subjectId)){alert('Bei einem Fachwechsel bitte eine passende Lehrkraft auswählen.');return false}
 if(d.lessons.some(x=>x.id!==id&&x.childId===rec.childId&&x.day===rec.day&&x.slot===rec.slot)){alert('Für diesen Platz ist bereits eine Stunde eingetragen. Bitte wähle einen anderen Platz.');return false}
 fresh?d.lessons.push(rec):d.lessons=d.lessons.map(x=>x.id===id?rec:x);return commit(d)
 },fresh?null:()=>{let d=copy();d.lessons=d.lessons.filter(x=>x.id!==id);return commit(d)});
 const subjectInput=document.getElementById('f_subjectId'),teacherInput=document.getElementById('f_teacherId'),newSubjectWrap=document.getElementById('newSubjectWrap');
 const toggleNewSubject=()=>{if(newSubjectWrap){newSubjectWrap.style.display=subjectInput.value?'none':'';if(subjectInput.value){const input=document.getElementById('f_newSubject');if(input)input.value='';}}};
 toggleNewSubject();
 const refreshTeachers=()=>{
  const previous=teacherInput.value;
  const items=[['','Keine Angabe'],...available(subjectInput.value).map(t=>[t.id,t.name])];
  teacherInput.innerHTML=items.map(([id,title])=>`<option value="${esc(id)}">${esc(title)}</option>`).join('');
  teacherInput.value=items.some(([id])=>id===previous)?previous:'';
 };
 subjectInput.addEventListener('change',()=>{toggleNewSubject();refreshTeachers()});
 // Bei Bearbeitung einer nicht mehr passenden Zuordnung wird diese angezeigt,
 // aber eine geänderte Fachauswahl setzt sie automatisch zurück.

}
function editTimes(){
 let c=child();if(!c)return;
 let n=c.times.length;
 const draw=n=>Array.from({length:n},(_,i)=>{let t=c.times[i]||['08:00','08:50'];return field(`${i+1}. Stunde · Beginn`,`start${i}`,'time',t[0],'required')+field(`${i+1}. Stunde · Ende`,`end${i}`,'time',t[1],'required')}).join('');
 dialog('Unterrichtszeiten','Stundenanzahl und Beginn/Ende individuell einstellen (1–16 Stunden).',
  `<div class="field full"><label for="periodCount">Anzahl der Stunden</label><input id="periodCount" type="number" min="1" max="16" value="${n}"></div><div id="periodFields" class="formGrid" style="grid-column:1/-1">${draw(n)}</div>`,v=>{
   let count=Number(document.getElementById('periodCount').value);
   if(!Number.isInteger(count)||count<1||count>16){alert('Bitte eine Stundenanzahl zwischen 1 und 16 wählen.');return false}
   let times=Array.from({length:count},(_,i)=>[v['start'+i],v['end'+i]]);
   if(times.some(t=>!t[0]||!t[1]||t[0]>=t[1])||times.some((t,i)=>i>0&&t[0]<times[i-1][1])){alert('Bitte gültige, überschneidungsfreie Stundenzeiten eintragen.');return false}
   if(data.lessons.some(l=>l.childId===c.id&&l.slot>=count)){alert('In den entfernten Stunden liegen noch Unterrichtseinträge. Bitte zuerst diese Stunden verschieben oder löschen.');return false}
   let d=copy();d.children=d.children.map(x=>x.id===c.id?{...x,times}:x);return commit(d)
 });
 const count=document.getElementById('periodCount');count.addEventListener('change',()=>{
  const amount=Math.max(1,Math.min(16,Number(count.value)||1));
  const currentValues=Object.fromEntries(new FormData(document.getElementById('editor')));
  c={...c,times:Array.from({length:amount},(_,i)=>[currentValues['start'+i]||c.times[i]?.[0]||'08:00',currentValues['end'+i]||c.times[i]?.[1]||'08:50'])};
  document.getElementById('periodFields').innerHTML=draw(amount)
 });
}
function copyDay(){
 const c=child();if(!c)return;
 const source=day;
 const entries=data.lessons.filter(l=>l.childId===c.id&&l.day===source);
 if(!entries.length){toast('Dieser Tag enthält noch keine Stunden');return}
 const targets=DAYS.map((name,index)=>index===source?null:[index,name]).filter(Boolean);
 dialog('Schultag kopieren','Nur leere Stundenplätze werden befüllt. Bereits eingetragene Stunden bleiben unverändert.',
 selectField('Zieltag','targetDay',targets,targets[0][0])+`<div class="field full"><small>${entries.length} Unterrichtsstunde(n) von ${DAYS[source]} übernehmen. Bestehende Einträge werden übersprungen.</small></div>`,v=>{
  const dest=Number(v.targetDay);if(dest===source||!Number.isInteger(dest)||dest<0||dest>=DAYS.length)return false;
  const d=copy();let count=0;
  for(const l of entries){if(d.lessons.some(x=>x.childId===c.id&&x.day===dest&&x.slot===l.slot))continue;
   d.lessons.push({...l,id:uid(),day:dest});count++;
  }
  if(!count){toast('Alle Stundenplätze am Zieltag sind bereits belegt');return false}
  day=dest;commit(d);toast(`${count} Stunde(n) übernommen · vorhandene Einträge erhalten`);return true
 });
}
function checkPersistence(){try{const probe='limegrid_health_'+uid();localStorage.setItem(probe,'prüfwert');const value=localStorage.getItem(probe);localStorage.removeItem(probe);if(value!=='prüfwert')throw Error('Speicherlesefehler');const live=localStorage.getItem(KEY);if(live===null&&data.children.length)throw Error('Vorhandene Daten nicht gespeichert');if(live!==null&&JSON.stringify(JSON.parse(live))!==JSON.stringify(data))throw Error('Speicherinhalt stimmt nicht mit der Anzeige überein');toast('Speicher-Leseprüfung erfolgreich ✓');storageMode='persistent';render()}catch(e){storageMode='blocked';render();alert('Dauerhafte Speicherung nicht verfügbar: '+e.message+'\nBitte JSON exportieren.')}}
function download(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download='LIMEGRID-Sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON-Sicherung zum Download angeboten')}
function importFile(){let input=document.getElementById('importFile');input.value='';input.click()}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('Die Sicherung ist zu groß.');const v=JSON.parse(await f.text());if(v.version!==1||!['children','subjects','teachers','lessons'].every(k=>Array.isArray(v[k])))throw Error('Unbekanntes Datenformat.');if(!v.children.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.times)&&c.times.every(t=>Array.isArray(t)&&t.length===2&&t.every(x=>/^\d\d:\d\d$/.test(x))))||!v.subjects.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&typeof s.abbr==='string')||!v.teachers.every(t=>typeof t.id==='string'&&typeof t.name==='string')||!v.lessons.every(l=>typeof l.id==='string'&&typeof l.childId==='string'&&Number.isInteger(l.day)&&l.day>=0&&l.day<=4&&Number.isInteger(l.slot)&&l.slot>=0))throw Error('Ungültige oder unvollständige Sicherungsdaten.');if(!confirm('Die vorhandenen Daten werden durch diese Sicherung ersetzt. Fortfahren? Bitte vorher exportieren.'))return;if(commit(migrate(v))){current=v.children[0]?.id||null;page='plan';render()}}catch(err){alert('Import fehlgeschlagen: '+err.message)}});
function action(a,id,d,s){if(a==='choose-child'){current=id;page='plan';render()}else if(a==='choose-day'){day=Math.max(0,Math.min(4,Number(d)||0));render()}else if(a==='week-open-day'){day=Math.max(0,Math.min(4,Number(d)||0));view='day';render()}else if(a==='day-prev'){day=(day+4)%5;render()}else if(a==='day-next'){day=(day+1)%5;render()}else if(a==='view-week'){view='week';render()}else if(a==='view-day'){view='day';render()}else if(a==='school-new')editSchool();else if(a==='school-edit')editSchool(id);else if(a==='child-new')editChild();else if(a==='child-edit')editChild(id);else if(a==='subject-new')editSubject();else if(a==='subject-edit')editSubject(id);else if(a==='teacher-new')editTeacher();else if(a==='teacher-edit')editTeacher(id);else if(a==='lesson-new')editLesson(null,d,s);else if(a==='lesson-edit')showLessonDetail(id);else if(a==='times')editTimes();else if(a==='day-copy')copyDay();else if(a==='storage-test')checkPersistence();else if(a==='export')download();else if(a==='import')importFile()}
window.addEventListener('beforeunload',e=>{if(storageMode==='blocked'&&(data.children.length||data.lessons.length||data.subjects.length)){e.preventDefault();e.returnValue=''}});
render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')) {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline-Installation nicht verfügbar:',err)))}
</script></body></html>
